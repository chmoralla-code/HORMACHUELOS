<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update button test harness</title>
    <link rel="stylesheet" href="/theme/tokens.css" />
    <link rel="stylesheet" href="/theme/globals.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/theme/workspace.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: var(--bg-0); }
      #sidebar { width: 308px; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar"></aside>
      <button id="background-action" type="button">Background action</button>
    </div>
    <script type="module">
      import { api } from "./ipc.ts";
      import { Sidebar } from "./components/sidebar.ts";
      import { checkDesktopUpdate, showUpdateDialog } from "./components/update-gate.ts";

      window.__updateMode = "available";
      window.__installError = "";
      api.appVersion = async () => "0.1.4";
      api.appInstallKind = async () => "msi";
      api.openExternalUrl = async (url) => {
        document.body.dataset.openedUrl = url;
      };
      api.saveUpdateBackup = async (stateJson) => {
        document.body.dataset.updateBackup = stateJson;
      };
      api.installAppUpdate = async (downloadUrl, version, sha256) => {
        if (window.__installError) throw window.__installError;
        document.body.dataset.installedUrl = downloadUrl;
        document.body.dataset.installedVersion = version;
        document.body.dataset.installedSha256 = sha256;
      };
      window.fetch = async () => {
        if (window.__updateMode === "error") {
          return new Response(JSON.stringify({ error: "offline" }), {
            status: 503,
            headers: { "Content-Type": "application/json" },
          });
        }
        const available = window.__updateMode === "available";
        return new Response(JSON.stringify({
          updateAvailable: available,
          forceUpdate: false,
          currentVersion: "0.1.4",
          latest: available ? {
            version: "0.1.5",
            title: "Hormachuelos 0.1.5",
            whatsNew: "Added the in-app Update button.",
            msiUrl: "https://hormachuelos.vercel.app/downloads/Hormachuelos_0.1.5_x64_en-US.msi",
            exeUrl: "https://hormachuelos.vercel.app/downloads/Hormachuelos_0.1.5_x64-setup.exe",
            msiSha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
            exeSha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          } : null,
        }), { status: 200, headers: { "Content-Type": "application/json" } });
      };

      const noop = () => {};
      const sidebar = new Sidebar({
        onNewProject: noop,
        onOpenProject: noop,
        onSelectProject: noop,
        onAddAnotherProject: noop,
        onOpenQuickSessions: noop,
        onOpenSettings: noop,
        onCheckForUpdates: () => document.body.appendChild(showUpdateDialog()),
        onNewSession: noop,
        onSelectSession: noop,
        onDeleteAllSessions: noop,
        onDeleteSession: noop,
        onRenameSession: noop,
        onExportClientPack: noop,
        onTopUp: noop,
        onManageAccount: noop,
        onRefreshAccount: noop,
      });
      sidebar.setProjectWorkspaces([
        { path: "C:\\Projects\\Atlas", name: "Atlas", addedAt: 1, lastOpenedAt: 3 },
        { path: "C:\\Projects\\Beacon", name: "Beacon", addedAt: 1, lastOpenedAt: 2 },
        { path: "C:\\Projects\\Cinder", name: "Cinder", addedAt: 1, lastOpenedAt: 1 },
      ], "C:\\Projects\\Atlas");
      await sidebar.render([
        { id: "session-atlas", title: "Build the client portal", projectId: "Atlas", messages: [], createdAt: 3 },
        { id: "session-beacon", title: "Review the launch checklist", projectId: "Atlas", messages: [], createdAt: 2 },
        { id: "session-cinder", title: "Refine the installation flow", projectId: "Atlas", messages: [], createdAt: 1 },
      ], "session-atlas");
      sidebar.setSessionUsage(0, 0, {
        planName: "pro",
        planActive: true,
        planRemaining: 93,
        planExpiresAt: "2026-08-30",
      });
      sidebar.setAccountStatus({ state: "synced", email: "hello@example.com", name: "Cyrhiel" });
      const update = await checkDesktopUpdate();
      sidebar.setUpdateNotification(
        update.updateAvailable || update.forceUpdate,
        update.latest?.version,
      );
    </script>
  </body>
</html>

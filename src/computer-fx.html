<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Computer FX</title>
  </head>
  <body class="computer-fx-body">
    <div id="fx-root" aria-hidden="true">
      <div id="fx-cursor" class="fx-cursor" hidden>
        <span class="fx-cursor-core"></span>
        <span class="fx-cursor-ring"></span>
      </div>
      <div id="fx-click" class="fx-click-ring" hidden></div>
      <div id="fx-typing" class="fx-typing-bubble" hidden>
        <span class="fx-typing-head">
          <span class="fx-typing-label">Typing</span>
          <span id="fx-typing-progress" class="fx-typing-progress" hidden></span>
        </span>
        <span id="fx-typing-text" class="fx-typing-text"></span>
        <span class="fx-typing-caret" aria-hidden="true"></span>
      </div>
      <div id="fx-trail" class="fx-trail"></div>
    </div>
    <script type="module" src="/computer-fx.ts"></script>
  </body>
</html>

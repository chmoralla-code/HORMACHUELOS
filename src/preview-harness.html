<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview mode test harness</title>
    <link rel="stylesheet" href="/theme/tokens.css" />
    <link rel="stylesheet" href="/theme/globals.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/theme/workspace.css" />
    <style>
      html, body, #app, .workbench { width: 100%; height: 100%; margin: 0; }
      #app { display: block; }
      .workbench { grid-template-columns: minmax(0, 1fr) minmax(520px, 52vw); }
      .test-stage { min-width: 0; background: #111; }
      #chat-queue-probe { display: none; }
    </style>
  </head>
  <body>
    <script>
      window.__TAURI_INTERNALS__ = window.__TAURI_INTERNALS__ || {};
      window.__TAURI_INTERNALS__.convertFileSrc = (filePath) =>
        `https://asset.localhost/${encodeURIComponent(String(filePath).replaceAll("\\", "/"))}`;
    </script>
    <div id="app">
      <div class="workbench">
        <main class="test-stage">
          <div id="chat-queue-probe">
            <div id="chat"></div>
            <div id="forge-dock"></div>
          </div>
        </main>
        <aside id="preview-test-host"></aside>
      </div>
    </div>
    <script type="module">
      import { api } from "./ipc.ts";
      import { Chat } from "./components/chat.ts";
      import {
        SitePreview,
        designTaskProfile,
        mergePreviewSessionState,
        rankDesignSourceCandidates,
      } from "./components/site-preview.ts";
      import { getProviderMeta, visibleProviders } from "./components/settings.ts";

      api.readProjectFile = async (relativePath) => ({
        path: relativePath,
        content: `<!doctype html>
          <html>
            <head>
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <style>
                @import "./assets/import.css";
                /* Keep literal example: url("./assets/comment.png"); */
                body { margin: 0; font-family: sans-serif; }
                #target {
                  margin: 24px;
                  padding: 18px;
                  background-image: url("./assets/style-block.png");
                }
                #literal-target::before { content: "url('./assets/literal.png')"; }
                @media (max-width: 500px) { body { background: rgb(230, 255, 235); } }
              </style>
            </head>
            <body>
              <button id="target">Preview target</button>
              <div id="inline-style-target" style="background-image: url('./assets/style-attribute.png')"></div>
              <div id="literal-target"></div>
            </body>
          </html>`,
        size: 512,
        language: "html",
      });
      // Browser tests do not have the Windows-only bounded preview capture
      // command. Mirror its successful result so the Design-mode flow can be
      // exercised end-to-end without granting the harness screen access.
      window.__previewCaptureRequests = [];
      api.capturePreviewSelection = async (region) => {
        window.__previewCaptureRequests.push(region);
        return "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADElEQVR42mP8z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC";
      };
      api.savePastedImage = async (dataBase64, mime) => {
        window.__previewSavedImages = window.__previewSavedImages || [];
        window.__previewSavedImages.push({ dataBase64, mime });
        return "C:\\preview-fixture\\design-feature-reference.png";
      };
      window.__sourceLensRequests = [];
      api.warmDesignSourceIndex = async () => 7;
      api.invalidateDesignSourceIndex = async () => {};
      api.resolveDesignTarget = async (probe) => {
        window.__sourceLensRequests.push(probe);
        const live = Boolean(probe.point);
        return {
          tag: live ? "button" : (probe.tag || "button"),
          text: live ? "Publish" : (probe.text || "Preview target"),
          selector: live ? "main > button.publish" : (probe.selector || "#target"),
          domContext: probe.domContext || {
            id: live ? "publish" : "target",
            classes: live ? ["publish"] : [],
            role: "",
            ariaLabel: "",
            testId: live ? "publish-action" : "preview-target",
            name: "",
            href: "/api/publish",
            html: live ? '<button class="publish">Publish</button>' : '<button id="target">Preview target</button>',
          },
          rect: live ? { x: 84, y: 92, width: 128, height: 52 } : null,
          sources: [
            { path: "src/components/PublishButton.tsx", line: 42, column: 7, kind: "frontend", confidence: "exact", symbol: "PublishButton" },
            { path: "src/styles/actions.css", line: 18, column: 1, kind: "style", confidence: "strong", symbol: null },
            { path: "src/server/routes/publish.ts", line: 27, column: 1, kind: "backend", confidence: "strong", symbol: "publish" },
          ],
          inspectedBy: live ? "webview" : "dom",
          indexPartial: false,
        };
      };

      const preview = new SitePreview(document.getElementById("preview-test-host"));
      window.__preview = preview;
      window.__previewPrompts = [];
      window.__previewPromptDispatches = [];
      window.__designTaskProfile = designTaskProfile;
      window.__rankDesignSourceCandidates = rankDesignSourceCandidates;
      preview.setDescribeHandler((request) => {
        window.__previewPrompts.push(request.prompt);
        window.__previewPromptDispatches.push(request);
        return "sent";
      });
      window.__chatQueueSends = [];
      const chatQueueProbe = new Chat({
        onSend: (submission) => window.__chatQueueSends.push(submission),
        onStop: () => {},
        onNeedProject: () => {},
        onOpenProject: () => {},
        onNewProject: () => {},
        onRevealProject: () => {},
        onOpenSettings: () => {},
        getSessionId: () => "preview-queue-probe",
      });
      chatQueueProbe.setProjectReady(true);
      window.__chatQueueProbe = chatQueueProbe;
      window.__mergePreviewSessionState = mergePreviewSessionState;
      document.body.dataset.providers = visibleProviders().map((provider) => provider.id).join(",");
      document.body.dataset.cursorModels = getProviderMeta("cursor")?.models.join(",") || "";
      document.body.dataset.hormachuelosFreeModels =
        getProviderMeta("hormachuelos_free")?.models.join(",") || "";

      const toolProbe = document.createElement("div");
      toolProbe.className = "tool-card-wrap tool-spawn";
      document.body.appendChild(toolProbe);
      document.body.dataset.toolAnimation = getComputedStyle(toolProbe).animationName;
      toolProbe.remove();

      const lightningProbe = document.createElement("div");
      lightningProbe.className = "tool-card pending";
      lightningProbe.innerHTML = '<span class="shine-ch shine-red">H</span>';
      document.body.appendChild(lightningProbe);
      const lightningStyle = getComputedStyle(lightningProbe.firstElementChild);
      document.body.dataset.agenticAnimation = lightningStyle.animationName;
      document.body.dataset.agenticColor = lightningStyle.color;
      lightningProbe.remove();

      const chipProbe = document.createElement("button");
      chipProbe.className = "chip chip-cap chip-cap-agentic";
      document.body.appendChild(chipProbe);
      document.body.dataset.agenticChipAnimation =
        getComputedStyle(chipProbe, "::after").animationName;
      chipProbe.remove();
      await preview.open({
        projectRoot: "C:\\preview-fixture",
        entryPath: "index.html",
        files: [
          "index.html",
          "assets/import.css",
          "assets/style-block.png",
          "assets/style-attribute.png",
          "src/pages/dashboard.tsx",
          "app/pages/incident-reports/page.tsx",
          "src/components/IncidentReportTable.tsx",
        ],
        title: "Mode test",
      });
    </script>
  </body>
</html>

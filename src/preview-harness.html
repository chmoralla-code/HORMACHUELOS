<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview mode test harness</title>
    <link rel="stylesheet" href="/theme/tokens.css" />
    <link rel="stylesheet" href="/theme/globals.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/theme/workspace.css" />
    <style>
      html, body, #app, .workbench { width: 100%; height: 100%; margin: 0; }
      #app { display: block; }
      .workbench { grid-template-columns: minmax(0, 1fr) minmax(520px, 52vw); }
      .test-stage { min-width: 0; background: #111; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="workbench">
        <main class="test-stage"></main>
        <aside id="preview-test-host"></aside>
      </div>
    </div>
    <script type="module">
      import { api } from "./ipc.ts";
      import { SitePreview } from "./components/site-preview.ts";
      import { visibleProviders } from "./components/settings.ts";

      api.readProjectFile = async (relativePath) => ({
        path: relativePath,
        content: `<!doctype html>
          <html>
            <head>
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <style>
                body { margin: 0; font-family: sans-serif; }
                #target { margin: 24px; padding: 18px; }
                @media (max-width: 500px) { body { background: rgb(230, 255, 235); } }
              </style>
            </head>
            <body><button id="target">Preview target</button></body>
          </html>`,
        size: 512,
        language: "html",
      });

      const preview = new SitePreview(document.getElementById("preview-test-host"));
      window.__preview = preview;
      document.body.dataset.providers = visibleProviders().map((provider) => provider.id).join(",");
      await preview.open({
        projectRoot: "C:\\preview-fixture",
        entryPath: "index.html",
        files: ["index.html"],
        title: "Mode test",
      });
    </script>
  </body>
</html>
